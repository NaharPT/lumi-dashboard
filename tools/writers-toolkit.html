<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writers Toolkit Dashboard</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #334155;
    --border: #475569;
    --text: #e2e8f0;
    --text-muted: #94a3b8;
    --accent: #38bdf8;
    --accent-dim: #0ea5e9;
    --danger: #f87171;
    --warn: #fbbf24;
    --ok: #4ade80;
    --purple: #a78bfa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 1.5rem;
  }

  .header { text-align: center; margin-bottom: 1.5rem; }
  .header h1 { font-size: 1.5rem; font-weight: 700; }
  .header .subtitle { color: var(--text-muted); font-size: 0.85rem; margin-top: 0.25rem; }

  .tabs {
    display: flex;
    gap: 0.25rem;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.5rem;
  }
  .tab-btn {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid transparent;
    padding: 0.4rem 0.75rem;
    border-radius: 0.375rem 0.375rem 0 0;
    cursor: pointer;
    font-size: 0.8rem;
    font-family: inherit;
    transition: all 0.15s;
  }
  .tab-btn:hover { color: var(--text); background: var(--surface); }
  .tab-btn.active {
    color: var(--accent);
    background: var(--surface);
    border-color: var(--border);
    border-bottom-color: var(--surface);
  }

  .tab-panel { display: none; max-width: 1000px; margin: 0 auto; }
  .tab-panel.active { display: block; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0.5rem;
    padding: 1.25rem;
    margin-bottom: 1rem;
  }
  .card h3 {
    font-size: 0.95rem;
    margin-bottom: 0.75rem;
    color: var(--accent);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1rem;
  }
  .stat-box {
    background: var(--surface2);
    border-radius: 0.375rem;
    padding: 0.75rem;
    text-align: center;
  }
  .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.25rem; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
  }
  th, td {
    padding: 0.5rem 0.75rem;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  th { color: var(--text-muted); font-weight: 600; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.5px; }

  .bar-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; }
  .bar-label { width: 120px; font-size: 0.75rem; color: var(--text-muted); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { flex: 1; height: 16px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
  .bar-value { width: 50px; font-size: 0.75rem; color: var(--text-muted); }

  .template-block {
    background: var(--surface2);
    border-left: 3px solid var(--accent);
    padding: 1rem;
    margin-bottom: 0.75rem;
    border-radius: 0 0.375rem 0.375rem 0;
    white-space: pre-wrap;
    font-size: 0.85rem;
    line-height: 1.6;
  }
  .template-label {
    font-size: 0.7rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 0.5rem;
    font-weight: 600;
  }

  .badge {
    display: inline-block;
    padding: 0.15rem 0.5rem;
    border-radius: 0.25rem;
    font-size: 0.7rem;
    font-weight: 600;
  }
  .badge-ok { background: rgba(74,222,128,0.15); color: var(--ok); }
  .badge-warn { background: rgba(251,191,36,0.15); color: var(--warn); }
  .badge-danger { background: rgba(248,113,113,0.15); color: var(--danger); }
  .badge-info { background: rgba(56,189,248,0.15); color: var(--accent); }
  .badge-purple { background: rgba(167,139,250,0.15); color: var(--purple); }

  .load-btn, .demo-btn, .analyze-btn {
    display: inline-block;
    padding: 0.5rem 1.25rem;
    border-radius: 0.375rem;
    cursor: pointer;
    font-size: 0.85rem;
    font-family: inherit;
    border: 1px solid var(--border);
    margin: 0.25rem;
    transition: all 0.15s;
  }
  .load-btn { background: var(--surface); color: var(--accent); }
  .load-btn:hover { background: var(--surface2); }
  .demo-btn { background: var(--accent-dim); color: white; border-color: var(--accent); }
  .demo-btn:hover { background: var(--accent); }
  .analyze-btn { background: var(--ok); color: #0f172a; border-color: var(--ok); font-weight: 600; font-size: 1rem; padding: 0.75rem 2rem; }
  .analyze-btn:hover { filter: brightness(1.1); }

  .empty-msg { color: var(--text-muted); text-align: center; padding: 2rem; font-size: 0.85rem; }

  .arc-chart { display: flex; align-items: flex-end; gap: 2px; height: 80px; margin: 0.5rem 0; }
  .arc-bar {
    flex: 1;
    border-radius: 2px 2px 0 0;
    min-width: 8px;
    position: relative;
    cursor: default;
  }
  .arc-bar .tooltip {
    display: none;
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 0.25rem 0.5rem;
    border-radius: 0.25rem;
    font-size: 0.7rem;
    white-space: nowrap;
    z-index: 10;
  }
  .arc-bar:hover .tooltip { display: block; }

  .howto {
    background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
    border: 1px solid var(--accent);
    border-radius: 0.75rem;
    padding: 2rem;
    text-align: center;
    margin-bottom: 1.5rem;
    max-width: 700px;
    margin-left: auto;
    margin-right: auto;
  }
  .howto h2 { font-size: 1.2rem; margin-bottom: 1rem; color: var(--accent); }
  .howto .steps {
    text-align: left;
    display: inline-block;
    margin-bottom: 1.5rem;
  }
  .howto .step {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    margin-bottom: 0.75rem;
    font-size: 0.9rem;
  }
  .howto .step-num {
    background: var(--accent);
    color: var(--bg);
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    flex-shrink: 0;
  }
  .howto .or { color: var(--text-muted); font-size: 0.8rem; margin: 1rem 0; }

  .footer {
    text-align: center;
    margin-top: 2rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
    font-size: 0.7rem;
    color: var(--text-muted);
  }
</style>
</head>
<body>

<div class="header">
  <h1>Writers Toolkit</h1>
  <div class="subtitle">8-Engine Manuscript Analysis Dashboard</div>
</div>

<div class="tabs" id="tabs"></div>
<div id="panels"></div>

<div class="footer">Writers Toolkit &middot; All analysis runs locally &middot; No data leaves your device</div>

<script>
'use strict';

var TABS = [
  { id: 'start', label: 'Get Started' },
  { id: 'pacing', label: 'Pacing' },
  { id: 'crutch', label: 'Crutch Words' },
  { id: 'beats', label: 'Beat Sheet' },
  { id: 'blurb', label: 'Blurb' },
  { id: 'diff', label: 'Draft Diff' },
  { id: 'voice', label: 'Voice' },
  { id: 'plot', label: 'Plot Holes' },
];

var state = {};

function el(tag, attrs, children) {
  var e = document.createElement(tag);
  if (attrs) Object.entries(attrs).forEach(function(kv) {
    var k = kv[0], v = kv[1];
    if (k === 'className') e.className = v;
    else if (k === 'textContent') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2).toLowerCase(), v);
    else e.setAttribute(k, v);
  });
  if (children) {
    (Array.isArray(children) ? children : [children]).forEach(function(c) {
      if (typeof c === 'string') e.appendChild(document.createTextNode(c));
      else if (c) e.appendChild(c);
    });
  }
  return e;
}

function statBox(value, label) {
  return el('div', { className: 'stat-box' }, [
    el('div', { className: 'stat-value', textContent: String(value) }),
    el('div', { className: 'stat-label', textContent: label }),
  ]);
}

function pct(v) { return Math.round(v * 100) + '%'; }

function barRow(label, value, max, color) {
  var w = max > 0 ? Math.min((value / max) * 100, 100) : 0;
  var fill = el('div', { className: 'bar-fill', style: 'width:' + w + '%;background:' + (color || 'var(--accent)') });
  return el('div', { className: 'bar-row' }, [
    el('span', { className: 'bar-label', textContent: label }),
    el('div', { className: 'bar-track' }, [fill]),
    el('span', { className: 'bar-value', textContent: String(typeof value === 'number' ? (value % 1 ? value.toFixed(1) : value) : value) }),
  ]);
}

function badge(text, type) {
  return el('span', { className: 'badge badge-' + type, textContent: text });
}

function makeTable(headers, rows) {
  var thead = el('thead', null, [el('tr', null, headers.map(function(h) { return el('th', { textContent: h }); }))]);
  var tbody = el('tbody', null, rows.map(function(row) {
    return el('tr', null, row.map(function(cell) {
      if (cell instanceof HTMLElement) { var td = el('td'); td.appendChild(cell); return td; }
      return el('td', { textContent: String(cell != null ? cell : '') });
    }));
  }));
  return el('table', null, [thead, tbody]);
}

function card(title, content) {
  var c = el('div', { className: 'card' });
  if (title) c.appendChild(el('h3', { textContent: title }));
  if (Array.isArray(content)) content.forEach(function(ch) { if (ch) c.appendChild(ch); });
  else if (content) c.appendChild(content);
  return c;
}

function emptyMsg(text) { return el('div', { className: 'empty-msg', textContent: text }); }

function loadFile(key, callback) {
  var input = el('input', { type: 'file', accept: '.json' });
  input.addEventListener('change', function() {
    var file = input.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function() {
      try {
        state[key] = JSON.parse(reader.result);
        callback();
      } catch (e) {
        alert('Invalid JSON: ' + e.message);
      }
    };
    reader.readAsText(file);
  });
  input.click();
}

function initTabs() {
  var tabsEl = document.getElementById('tabs');
  var panelsEl = document.getElementById('panels');

  TABS.forEach(function(t, i) {
    var btn = el('button', {
      className: 'tab-btn' + (i === 0 ? ' active' : ''),
      textContent: t.label,
      'data-tab': t.id,
      onClick: function() {
        tabsEl.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
        btn.classList.add('active');
        panelsEl.querySelectorAll('.tab-panel').forEach(function(p) { p.classList.remove('active'); });
        document.getElementById('panel-' + t.id).classList.add('active');
      },
    });
    tabsEl.appendChild(btn);

    var panel = el('div', { className: 'tab-panel' + (i === 0 ? ' active' : ''), id: 'panel-' + t.id });
    panelsEl.appendChild(panel);
  });

  renderAll();
}

function renderAll() {
  renderStart();
  renderPacing();
  renderCrutch();
  renderBeats();
  renderBlurb();
  renderDiff();
  renderVoice();
  renderPlot();
}

function renderStart() {
  var p = document.getElementById('panel-start');
  p.replaceChildren();

  var howto = el('div', { className: 'howto' });
  howto.appendChild(el('h2', { textContent: 'Analyze Your Manuscript' }));

  var steps = el('div', { className: 'steps' });
  var stepData = [
    'Double-click analyze.ps1 in the writers-toolkit folder',
    'Pick your manuscript (.md file) from the file dialog',
    'All 5 manuscript engines run automatically',
    'Load the JSON results below (or they auto-appear here)',
  ];
  stepData.forEach(function(text, i) {
    var step = el('div', { className: 'step' }, [
      el('span', { className: 'step-num', textContent: String(i + 1) }),
      el('span', { textContent: text }),
    ]);
    steps.appendChild(step);
  });
  howto.appendChild(steps);

  howto.appendChild(el('div', { className: 'or', textContent: '-- or load results directly --' }));

  var btnRow = el('div');
  var demoBtn = el('button', { className: 'demo-btn', textContent: 'Load Demo Data', onClick: function() { loadDemoData(); } });
  btnRow.appendChild(demoBtn);
  howto.appendChild(btnRow);

  p.appendChild(howto);

  // Engine load buttons
  var engines = [
    { key: 'pacing', name: 'Pacing', file: 'pacing.json' },
    { key: 'crutch', name: 'Crutch Words', file: 'crutch_words.json' },
    { key: 'beats', name: 'Beat Sheet', file: 'beat_sheet.json' },
    { key: 'blurb', name: 'Blurb', file: 'blurb.json' },
    { key: 'diff', name: 'Draft Diff', file: 'draft_diff.json' },
    { key: 'voice', name: 'Voice', file: 'voice_fingerprints.json' },
    { key: 'plot', name: 'Plot Holes', file: 'plot_holes.json' },
    { key: 'cover', name: 'Cover Brief', file: 'cover_art.json' },
  ];

  var loaded = engines.filter(function(e) { return state[e.key]; }).length;

  var grid = el('div', { className: 'stats-grid' }, [
    statBox('8', 'Engines'),
    statBox(String(loaded), 'Data Loaded'),
  ]);

  var rows = engines.map(function(e) {
    return [e.name, e.file, state[e.key] ? badge('Loaded', 'ok') : badge('Not loaded', 'info')];
  });

  var loadBtns = el('div', { style: 'display:flex;flex-wrap:wrap;gap:0.5rem;justify-content:center;margin-top:1rem' });
  engines.forEach(function(e) {
    var btn = el('button', {
      className: 'load-btn',
      textContent: 'Load ' + e.name,
      onClick: function() { loadFile(e.key, renderAll); },
    });
    loadBtns.appendChild(btn);
  });

  p.appendChild(card('Engine Status', [grid, makeTable(['Engine', 'File', 'Status'], rows), loadBtns]));
}

// --- Individual panel renderers (same as before) ---

function renderPacing() {
  var p = document.getElementById('panel-pacing');
  p.replaceChildren();
  var d = state.pacing;
  if (!d) { p.appendChild(emptyMsg('Load pacing.json to view pacing analysis.')); return; }
  var chapters = d.chapters || [];
  p.appendChild(card('Summary', [el('div', { className: 'stats-grid' }, [
    statBox(chapters.length, 'Chapters'),
    statBox(d.avg_chapter_length || 0, 'Avg Length'),
    statBox(typeof d.overall_pacing_score === 'number' ? d.overall_pacing_score.toFixed(2) : '?', 'Pacing Score'),
  ])]));
  var maxWc = Math.max.apply(null, chapters.map(function(c) { return c.word_count || 0; }).concat([1]));
  var bars = el('div');
  chapters.forEach(function(c) {
    bars.appendChild(barRow('Ch ' + c.chapter + (c.title ? ' ' + c.title.slice(0, 12) : ''), c.word_count || 0, maxWc, c.flag ? 'var(--warn)' : 'var(--accent)'));
  });
  p.appendChild(card('Word Count by Chapter', [bars]));
  var scoreBars = el('div');
  chapters.forEach(function(c) {
    scoreBars.appendChild(barRow('Ch ' + c.chapter, c.pacing_score || 0, 1.0, 'var(--purple)'));
  });
  p.appendChild(card('Pacing Score (0=slow, 1=fast)', [scoreBars]));
  var rows = chapters.map(function(c) {
    return [c.chapter, c.title || '', c.word_count || 0, (c.dialogue_ratio || 0).toFixed(2), (c.action_density || 0).toFixed(1), c.scene_break_count || 0, (c.pacing_score || 0).toFixed(2), c.flag ? badge(c.flag, 'warn') : badge('ok', 'ok')];
  });
  p.appendChild(card('Chapter Details', [makeTable(['Ch', 'Title', 'Words', 'Dialogue', 'Action', 'Breaks', 'Score', 'Flag'], rows)]));
}

function renderCrutch() {
  var p = document.getElementById('panel-crutch');
  p.replaceChildren();
  var d = state.crutch;
  if (!d) { p.appendChild(emptyMsg('Load crutch_words.json to view analysis.')); return; }
  p.appendChild(card('Summary', [el('div', { className: 'stats-grid' }, [
    statBox(d.total_crutch_count || 0, 'Total Crutches'),
    statBox(d.manuscript_word_count || 0, 'Words'),
    statBox((d.overall_density || 0).toFixed(1), 'Per 1K Words'),
    statBox((d.adverb_density || 0).toFixed(1), 'Adverb Density'),
  ])]));
  var offenders = d.top_offenders || [];
  if (offenders.length) {
    var maxCount = Math.max.apply(null, offenders.map(function(o) { return o.total_count || 0; }).concat([1]));
    var bars = el('div');
    offenders.slice(0, 20).forEach(function(o) {
      var catColor = o.category === 'filter' ? 'var(--warn)' : o.category === 'adverb' ? 'var(--purple)' : 'var(--danger)';
      bars.appendChild(barRow(o.word + ' (' + o.category + ')', o.total_count || 0, maxCount, catColor));
    });
    p.appendChild(card('Top Offenders', [bars]));
  }
  var chStats = d.chapter_stats || [];
  if (chStats.length) {
    var maxDensity = Math.max.apply(null, chStats.map(function(c) { return c.crutch_density || 0; }).concat([1]));
    var bars2 = el('div');
    chStats.forEach(function(c) {
      var color = (c.crutch_density || 0) > maxDensity * 0.7 ? 'var(--danger)' : 'var(--accent)';
      bars2.appendChild(barRow('Ch ' + c.chapter, (c.crutch_density || 0).toFixed(1), maxDensity, color));
    });
    p.appendChild(card('Density per Chapter', [bars2]));
  }
}

function renderBeats() {
  var p = document.getElementById('panel-beats');
  p.replaceChildren();
  var d = state.beats;
  if (!d) { p.appendChild(emptyMsg('Load beat_sheet.json to view analysis.')); return; }
  p.appendChild(card('Summary', [el('div', { className: 'stats-grid' }, [
    statBox(d.total_beats || 15, 'Total Beats'),
    statBox(d.mapped_count || 0, 'Mapped'),
    statBox(d.gap_count || 0, 'Gaps'),
  ])]));
  var beats = d.beats || [];
  var rows = beats.map(function(b) {
    var sb = b.status === 'mapped' ? badge('Mapped', 'ok') : b.status === 'gap' ? badge('Gap', 'danger') : badge(b.status || '?', 'warn');
    return [b.beat_name || '', pct(b.expected_position || 0), b.actual_chapter != null ? 'Ch ' + b.actual_chapter : '-', pct(b.actual_position || 0), (b.confidence || 0).toFixed(2), sb];
  });
  p.appendChild(card('Beat Mapping', [makeTable(['Beat', 'Expected', 'Chapter', 'Actual', 'Confidence', 'Status'], rows)]));
  var acts = d.act_balance || [];
  if (acts.length) {
    var actRows = acts.map(function(a) {
      return [a.act, a.word_count || 0, pct(a.percentage || 0), pct(a.expected_percentage || 0), a.balance === 'balanced' ? badge('Balanced', 'ok') : a.balance === 'heavy' ? badge('Heavy', 'warn') : badge('Light', 'info')];
    });
    p.appendChild(card('Act Balance', [makeTable(['Act', 'Words', 'Actual', 'Expected', 'Balance'], actRows)]));
  }
  var arc = d.emotional_arc || [];
  if (arc.length) {
    var arcChart = el('div', { className: 'arc-chart' });
    arc.forEach(function(pt) {
      var norm = (pt.sentiment_score + 1) / 2;
      var h = Math.max(norm * 80, 4);
      var color = pt.sentiment_score > 0.1 ? 'var(--ok)' : pt.sentiment_score < -0.1 ? 'var(--danger)' : 'var(--text-muted)';
      var bar = el('div', { className: 'arc-bar', style: 'height:' + h + 'px;background:' + color });
      bar.appendChild(el('span', { className: 'tooltip', textContent: 'Ch ' + pt.chapter + ': ' + (pt.sentiment_score || 0).toFixed(2) }));
      arcChart.appendChild(bar);
    });
    p.appendChild(card('Emotional Arc', [arcChart]));
  }
}

function renderBlurb() {
  var p = document.getElementById('panel-blurb');
  p.replaceChildren();
  var d = state.blurb;
  if (!d) { p.appendChild(emptyMsg('Load blurb.json to view generated blurbs.')); return; }
  p.appendChild(card('Extracted Data', [el('div', { className: 'stats-grid' }, [
    statBox(d.protagonist || '?', 'Protagonist'),
    statBox(d.antagonist || '?', 'Antagonist'),
    statBox(d.genre || '?', 'Genre'),
    statBox(d.word_count || 0, 'Words'),
  ])]));
  var templates = [['Back Cover Blurb', d.back_cover_template], ['Query Letter Pitch', d.query_pitch_template], ['Amazon Description', d.amazon_description_template]];
  templates.forEach(function(pair) {
    if (!pair[1]) return;
    p.appendChild(card(null, [el('div', { className: 'template-label', textContent: pair[0] }), el('div', { className: 'template-block', textContent: pair[1] })]));
  });
}

function renderDiff() {
  var p = document.getElementById('panel-diff');
  p.replaceChildren();
  var d = state.diff;
  if (!d) { p.appendChild(emptyMsg('Load draft_diff.json to view comparison.')); return; }
  var delta = d.total_words_delta || 0;
  p.appendChild(card((d.old_title || '?') + ' vs ' + (d.new_title || '?'), [el('div', { className: 'stats-grid' }, [
    statBox((d.total_words_old || 0).toLocaleString(), 'Words (Old)'),
    statBox((d.total_words_new || 0).toLocaleString(), 'Words (New)'),
    statBox((delta >= 0 ? '+' : '') + delta.toLocaleString(), 'Delta'),
    statBox(pct(d.overall_revision_intensity || 0), 'Intensity'),
  ])]));
  p.appendChild(card('Structural Changes', [el('div', { className: 'stats-grid' }, [
    statBox(d.chapters_modified || 0, 'Modified'),
    statBox(d.chapters_added || 0, 'Added'),
    statBox(d.chapters_removed || 0, 'Removed'),
    statBox(d.chapters_unchanged || 0, 'Unchanged'),
  ])]));
  var diffs = d.chapter_diffs || [];
  if (diffs.length) {
    var bars = el('div');
    diffs.forEach(function(cd) {
      var title = cd.title_new || cd.title_old || 'Ch ' + cd.chapter;
      var color = cd.status === 'added' ? 'var(--ok)' : cd.status === 'removed' ? 'var(--danger)' : cd.revision_intensity > 0.5 ? 'var(--warn)' : 'var(--accent)';
      bars.appendChild(barRow('Ch ' + cd.chapter + ' ' + title.slice(0, 10), cd.revision_intensity || 0, 1.0, color));
    });
    p.appendChild(card('Revision Intensity', [bars]));
  }
  var cc = d.character_changes || [];
  if (cc.length) {
    var rows = cc.map(function(pair) { return [pair[0] || '', pair[1] || '']; });
    p.appendChild(card('Character Renames', [makeTable(['Old Name', 'New Name'], rows)]));
  }
}

function renderVoice() {
  var p = document.getElementById('panel-voice');
  p.replaceChildren();
  var d = state.voice;
  if (!d) { p.appendChild(emptyMsg('Load voice_fingerprints.json to view analysis.')); return; }
  var fps = d.fingerprints || d.voices || [];
  var sims = d.similarities || d.comparisons || [];
  if (fps.length) {
    var rows = fps.map(function(f) { return [f.character || '', f.total_lines || 0, (f.vocabulary_richness || 0).toFixed(2), (f.avg_sentence_length || 0).toFixed(1), (f.formality_score || 0).toFixed(2), (f.contraction_ratio || 0).toFixed(2)]; });
    p.appendChild(card('Character Voices', [makeTable(['Character', 'Lines', 'Vocab', 'Avg Sent', 'Formality', 'Contractions'], rows)]));
  }
  if (sims.length) {
    var rows2 = sims.map(function(s) {
      var fb = s.flag === 'identical' ? badge('Identical!', 'danger') : s.flag === 'very_similar' ? badge('Very Similar', 'warn') : badge('OK', 'ok');
      return [s.character_a || '', s.character_b || '', ((s.similarity || 0) * 100).toFixed(0) + '%', fb];
    });
    p.appendChild(card('Voice Similarity', [makeTable(['Character A', 'Character B', 'Similarity', 'Flag'], rows2)]));
  }
}

function renderPlot() {
  var p = document.getElementById('panel-plot');
  p.replaceChildren();
  var d = state.plot;
  if (!d) { p.appendChild(emptyMsg('Load plot_holes.json to view analysis.')); return; }
  var holes = d.holes || [];
  p.appendChild(card('Summary', [el('div', { className: 'stats-grid' }, [
    statBox(holes.length, 'Issues'),
    statBox(holes.filter(function(h) { return h.severity === 'critical'; }).length, 'Critical'),
    statBox(holes.filter(function(h) { return h.severity === 'warning'; }).length, 'Warnings'),
  ])]));
  if (holes.length) {
    var rows = holes.map(function(h) {
      var sev = h.severity === 'critical' ? badge('Critical', 'danger') : h.severity === 'warning' ? badge('Warning', 'warn') : badge('Info', 'info');
      return [sev, h.category || '', h.title || '', h.description || '', (h.chapters || []).join(', ')];
    });
    p.appendChild(card('Plot Issues', [makeTable(['Severity', 'Category', 'Title', 'Description', 'Chapters'], rows)]));
  }
}
